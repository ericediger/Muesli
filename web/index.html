<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muesli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d97a3a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23151515'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <div class="brand-name">Muesli</div>
        <div class="brand-sub" id="brand-sub">local · offline archive</div>
      </div>
    </div>
    <nav class="nav">
      <a href="#/home" data-page="home">Overview</a>
      <a href="#/notes" data-page="notes">Notes</a>
      <a href="#/people" data-page="people">People</a>
      <a href="#/ask" data-page="ask">Ask</a>
      <a href="#/profiles" data-page="profiles">Profiles</a>
      <a href="#/export" data-page="export">Export</a>
      <a href="#/settings" data-page="settings">Settings</a>
    </nav>
    <div class="sidebar-foot">
      <div class="basket" id="basket">
        <div class="basket-head"><span>Selected notes</span><button class="link" id="basket-clear" title="Clear selection">clear</button></div>
        <div class="basket-list" id="basket-list"><span class="muted">None. Tick notes on the Notes page to use them in Ask or Export.</span></div>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark">
        <span class="sun">☀</span><span class="moon">☾</span><span id="theme-label">Dark</span>
      </button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
